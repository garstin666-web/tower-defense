<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>奶龍保衛戰 (3D Touch-Fixed Tower Defense)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a10;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      width: min(300px, 90vw);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100; /* 確保 UI 在最上層 */
      max-height: calc(100vh - 24px);
      overflow-y: auto;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 10px;
    }
    .stat-card {
      font-size: 11px;
      color: #94a3b8;
    }
    .stat-val {
      font-size: 16px;
      font-weight: bold;
      color: #facc15;
    }
    .stat-val.hp { color: #f43f5e; }
    .stat-val.enemy { color: #c084fc; }

    .section-title {
      font-size: 11px;
      font-weight: bold;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tower-select {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tower-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      min-height: 44px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid transparent;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tower-btn:active {
      transform: scale(0.98);
    }
    .tower-btn.active {
      border-color: #38bdf8;
      background: rgba(30, 58, 138, 0.7);
    }
    .tower-name { font-size: 13px; font-weight: bold; }
    .tower-cost { font-size: 12px; color: #facc15; font-weight: bold; }

    .action-btn {
      width: 100%;
      padding: 12px;
      min-height: 46px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .action-btn:disabled {
      background: #475569;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .mgmt-box {
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .mgmt-box.active { display: flex; }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-up {
      background: #facc15;
      color: #000;
      font-weight: bold;
      padding: 8px;
      min-height: 40px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-sell {
      background: #ef4444;
      color: #fff;
      font-weight: bold;
      padding: 8px;
      min-height: 40px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .controls-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <h1>⚔️ 奶龍保衛戰 (3D)</h1>

    <div class="stats-grid">
      <div class="stat-card">金幣: <div class="stat-val" id="gold-val">160</div></div>
      <div class="stat-card">城堡生命: <div class="stat-val hp" id="lives-val">15</div></div>
      <div class="stat-card">進攻波次: <div class="stat-val" id="wave-val">0</div></div>
      <div class="stat-card">剩餘魔物: <div class="stat-val enemy" id="enemy-val">0</div></div>
    </div>

    <div>
      <div class="section-title">選擇防禦塔</div>
      <div class="tower-select">
        <div class="tower-btn active" data-type="arrow">
          <span class="tower-name">🏹 箭樓石塔</span>
          <span class="tower-cost">$50</span>
        </div>
        <div class="tower-btn" data-type="cannon">
          <span class="tower-name">💣 重型鋼砲</span>
          <span class="tower-cost">$100</span>
        </div>
        <div class="tower-btn" data-type="frost">
          <span class="tower-name">❄️ 冰晶法塔</span>
          <span class="tower-cost">$75</span>
        </div>
      </div>
    </div>

    <div id="tower-mgmt" class="mgmt-box">
      <div class="section-title">防禦塔控制</div>
      <div id="mgmt-info" style="font-size:12px; color:#cbd5e1;">等級: 1</div>
      <div class="btn-group">
        <button id="btn-upgrade" class="btn-up">升級</button>
        <button id="btn-sell" class="btn-sell">出售</button>
      </div>
    </div>

    <button id="start-wave-btn" class="action-btn">⚔️ 開始魔物進攻</button>
  </div>

  <div class="controls-hint">💡 觸控提示：單指旋轉視角 | 雙指縮放 | 輕觸草地放置防禦塔</div>

  <script>
    // --- 1. 遊戲基礎狀態變數 ---
    const COLS = 16;
    const ROWS = 10;
    const TILE_SIZE = 2;

    let gold = 160;
    let lives = 15;
    let wave = 0;
    let waveInProgress = false;
    let enemiesToSpawn = 0;
    let spawnTimer = 0;

    let enemies = [];
    let towers = [];
    let projectiles = [];
    let particles = [];

    let selectedType = 'arrow';
    let selectedPlacedTower = null;

    // 地圖格點與 3D Waypoints
    const gridPath = [
      {x: 0, y: 2}, {x: 4, y: 2}, {x: 4, y: 7},
      {x: 11, y: 7}, {x: 11, y: 3}, {x: 15, y: 3}
    ];

    const waypoints = gridPath.map(pt => new THREE.Vector3(
      (pt.x - COLS / 2 + 0.5) * TILE_SIZE,
      0.5,
      (pt.y - ROWS / 2 + 0.5) * TILE_SIZE
    ));

    function isPathTile(col, row) {
      for (let i = 0; i < gridPath.length - 1; i++) {
        const p1 = gridPath[i];
        const p2 = gridPath[i+1];
        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);
        if (col >= minX && col <= maxX && row >= minY && row <= maxY) return true;
      }
      return false;
    }

    const TOWER_TYPES = {
      arrow: { name: '箭樓石塔', cost: 50, range: 6, rate: 20, damage: 18, color: 0x38bdf8 },
      cannon: { name: '重型鋼砲', cost: 100, range: 7, rate: 60, damage: 55, splash: 3, color: 0xef4444 },
      frost: { name: '冰晶法塔', cost: 75, range: 5.5, rate: 35, damage: 12, slow: 0.5, color: 0xa855f7 }
    };

    // --- 2. 初始化 Three.js 3D 渲染器、相機與光源 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c16);
    scene.fog = new THREE.FogExp2(0x0a0c16, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 22, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.15;

    // 光源設置
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
    dirLight.position.set(15, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    const d = 20;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // --- 3. 建立 3D 地圖與網格模型 ---
    const gridMeshes = [];
    const gridGroup = new THREE.Group();

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const isPath = isPathTile(c, r);
        const geo = new THREE.BoxGeometry(TILE_SIZE - 0.08, isPath ? 0.4 : 0.8, TILE_SIZE - 0.08);
        const mat = new THREE.MeshStandardMaterial({
          color: isPath ? 0x475569 : ((c + r) % 2 === 0 ? 0x1e293b : 0x0f172a),
          roughness: 0.8
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          (c - COLS / 2 + 0.5) * TILE_SIZE,
          isPath ? 0.2 : 0.4,
          (r - ROWS / 2 + 0.5) * TILE_SIZE
        );
        mesh.receiveShadow = true;
        mesh.userData = { col: c, row: r, isPath: isPath };
        gridGroup.add(mesh);
        gridMeshes.push(mesh);
      }
    }
    scene.add(gridGroup);

    // 建塔高亮指示框
    const hoverGeo = new THREE.BoxGeometry(TILE_SIZE, 0.1, TILE_SIZE);
    const hoverMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
    const hoverMesh = new THREE.Mesh(hoverGeo, hoverMat);
    hoverMesh.visible = false;
    scene.add(hoverMesh);

    // --- 4. 3D 防禦塔與敵人模型生成器 ---
    function create3DTowerMesh(type) {
      const group = new THREE.Group();
      if (type === 'arrow') {
        const baseGeo = new THREE.CylinderGeometry(0.7, 0.8, 1.8, 8);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.9;
        base.castShadow = true;
        group.add(base);

        const roofGeo = new THREE.ConeGeometry(0.9, 0.8, 8);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xb45309 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 2.1;
        roof.castShadow = true;
        group.add(roof);
      } else if (type === 'cannon') {
        const baseGeo = new THREE.BoxGeometry(1.4, 0.8, 1.4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.4;
        base.castShadow = true;
        group.add(base);

        const barrelGeo = new THREE.CylinderGeometry(0.3, 0.35, 1.2, 12);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 3;
        barrel.position.set(0, 1.0, 0.2);
        barrel.castShadow = true;
        group.add(barrel);
      } else if (type === 'frost') {
        const baseGeo = new THREE.CylinderGeometry(0.5, 0.7, 1.2, 6);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.6;
        base.castShadow = true;
        group.add(base);

        const crystalGeo = new THREE.OctahedronGeometry(0.6, 0);
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0x7e22ce, roughness: 0.1 });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        crystal.position.y = 1.8;
        crystal.castShadow = true;
        group.add(crystal);
      }
      return group;
    }

    function create3DEnemyMesh(type) {
      const group = new THREE.Group();
      if (type === 'goblin') {
        const bodyGeo = new THREE.SphereGeometry(0.4, 8, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.4;
        body.castShadow = true;
        group.add(body);
      } else if (type === 'wolf') {
        const bodyGeo = new THREE.BoxGeometry(0.5, 0.5, 1.0);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.4;
        body.castShadow = true;
        group.add(body);
      } else if (type === 'golem') {
        const bodyGeo = new THREE.BoxGeometry(0.9, 1.2, 0.9);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.9 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        body.castShadow = true;
        group.add(body);
      }
      return group;
    }

    // --- 5. 核心：全新的觸控與點擊分離邏輯 (避免被 OrbitControls 阻擋) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 監聽按下的起點
    function handlePointerDown(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-overlay')) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      
      pointerDownX = clientX;
      pointerDownY = clientY;
      pointerDownTime = Date.now();
    }

    // 監聽釋放點 (抬起手指時判定是否為「點擊建塔」)
    function handlePointerUp(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.ui-overlay')) return;

      const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

      if (clientX === undefined || clientY === undefined) return;

      const moveDist = Math.hypot(clientX - pointerDownX, clientY - pointerDownY);
      const duration = Date.now() - pointerDownTime;

      // 只有當手指移動距離 < 10 像素 且 按下時間 < 400ms，才代表「點擊選格/建塔」
      if (moveDist < 10 && duration < 400) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(gridMeshes);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          const col = hit.userData.col;
          const row = hit.userData.row;

          const existing = towers.find(t => t.col === col && t.row === row);
          if (existing) {
            selectedPlacedTower = existing;
            updateUI();
            return;
          }

          selectedPlacedTower = null;

          if (!hit.userData.isPath) {
            const config = TOWER_TYPES[selectedType];
            if (gold >= config.cost) {
              gold -= config.cost;
              const mesh = create3DTowerMesh(selectedType);
              mesh.position.set(hit.position.x, 0.8, hit.position.z);
              scene.add(mesh);

              towers.push({
                col, row,
                mesh: mesh,
                type: selectedType,
                cost: config.cost,
                range: config.range,
                rate: config.rate,
                damage: config.damage,
                level: 1,
                cooldown: 0
              });
            }
          }
          updateUI();
        }
      }
    }

    // 捕獲階段監聽 (useCapture = true)，優先於 OrbitControls 抓取按下與抬起動作
    window.addEventListener('mousedown', handlePointerDown, true);
    window.addEventListener('mouseup', handlePointerUp, true);

    window.addEventListener('touchstart', handlePointerDown, { passive: true, capture: true });
    window.addEventListener('touchend', handlePointerUp, { passive: true, capture: true });

    // UI 按鈕監聽
    document.querySelectorAll('.tower-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedType = btn.dataset.type;
        selectedPlacedTower = null;
        updateUI();
      });
    });

    const startWaveBtn = document.getElementById('start-wave-btn');
    startWaveBtn.addEventListener('click', () => {
      if (waveInProgress) return;
      wave++;
      waveInProgress = true;
      enemiesToSpawn = 6 + wave * 3;
      spawnTimer = 0;
      startWaveBtn.disabled = true;
      updateUI();
    });

    document.getElementById('btn-upgrade').addEventListener('click', () => {
      if (!selectedPlacedTower) return;
      const upgradeCost = Math.floor(selectedPlacedTower.cost * 0.8);
      if (gold >= upgradeCost) {
        gold -= upgradeCost;
        selectedPlacedTower.level++;
        selectedPlacedTower.damage = Math.floor(selectedPlacedTower.damage * 1.45);
        selectedPlacedTower.range += 0.8;
        selectedPlacedTower.cost += upgradeCost;
        selectedPlacedTower.mesh.scale.multiplyScalar(1.1);
        updateUI();
      }
    });

    document.getElementById('btn-sell').addEventListener('click', () => {
      if (!selectedPlacedTower) return;
      gold += Math.floor(selectedPlacedTower.cost * 0.6);
      scene.remove(selectedPlacedTower.mesh);
      towers = towers.filter(t => t !== selectedPlacedTower);
      selectedPlacedTower = null;
      updateUI();
    });

    function updateUI() {
      document.getElementById('gold-val').innerText = gold;
      document.getElementById('lives-val').innerText = lives;
      document.getElementById('wave-val').innerText = wave;
      document.getElementById('enemy-val').innerText = enemies.length + enemiesToSpawn;

      const mgmtPanel = document.getElementById('tower-mgmt');
      if (selectedPlacedTower) {
        mgmtPanel.classList.add('active');
        const upgradeCost = Math.floor(selectedPlacedTower.cost * 0.8);
        const sellVal = Math.floor(selectedPlacedTower.cost * 0.6);
        document.getElementById('mgmt-info').innerHTML = `
          <b>${TOWER_TYPES[selectedPlacedTower.type].name} (Lv.${selectedPlacedTower.level})</b><br>
          攻擊力: ${selectedPlacedTower.damage}<br>
          射程: ${selectedPlacedTower.range.toFixed(1)}
        `;
        document.getElementById('btn-upgrade').innerText = `升級 ($${upgradeCost})`;
        document.getElementById('btn-upgrade').disabled = gold < upgradeCost;
        document.getElementById('btn-sell').innerText = `出售 (+$${sellVal})`;
      } else {
        mgmtPanel.classList.remove('active');
      }
    }

    // --- 6. 遊戲邏輯與 3D 渲染主迴圈 ---
    function spawnEnemy() {
      const typeRand = Math.random();
      let type = 'goblin';
      let hpMult = 1;
      let speed = 0.05;

      if (wave > 2 && typeRand > 0.5) { type = 'wolf'; speed = 0.08; hpMult = 1.2; }
      else if (wave > 4 && typeRand > 0.8) { type = 'golem'; speed = 0.03; hpMult = 3.2; }

      const maxHp = Math.floor(45 * Math.pow(1.26, wave - 1) * hpMult);
      const mesh = create3DEnemyMesh(type);
      mesh.position.copy(waypoints[0]);
      scene.add(mesh);

      enemies.push({
        mesh: mesh,
        targetIdx: 1,
        type: type,
        hp: maxHp,
        maxHp: maxHp,
        speed: speed,
        currentSpeed: speed,
        slowTimer: 0,
        reward: 12 + Math.floor(wave * 1.5)
      });
    }

    function createExplosionEffect(pos, colorHex) {
      for (let i = 0; i < 8; i++) {
        const pGeo = new THREE.SphereGeometry(0.1, 4, 4);
        const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.copy(pos);
        scene.add(pMesh);

        particles.push({
          mesh: pMesh,
          vel: new THREE.Vector3((Math.random() - 0.5) * 0.2, Math.random() * 0.2, (Math.random() - 0.5) * 0.2),
          life: 15
        });
      }
    }

    function updateGame() {
      if (waveInProgress && enemiesToSpawn > 0) {
        spawnTimer++;
        if (spawnTimer >= 35) {
          spawnEnemy();
          enemiesToSpawn--;
          spawnTimer = 0;
        }
      }

      // 粒子更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.vel);
        p.life--;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // 敵人移動
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.slowTimer > 0) {
          enemy.slowTimer--;
          enemy.currentSpeed = enemy.speed * 0.5;
        } else {
          enemy.currentSpeed = enemy.speed;
        }

        const target = waypoints[enemy.targetIdx];
        const dir = new THREE.Vector3().subVectors(target, enemy.mesh.position);
        const dist = dir.length();

        if (dist < enemy.currentSpeed) {
          enemy.mesh.position.copy(target);
          enemy.targetIdx++;
          if (enemy.targetIdx >= waypoints.length) {
            lives--;
            scene.remove(enemy.mesh);
            enemies.splice(i, 1);
            if (lives <= 0) {
              alert('💥 城堡淪陷！遊戲結束！成功抵擋 ' + (wave - 1) + ' 波魔物。');
              location.reload();
            }
            continue;
          }
        } else {
          dir.normalize();
          enemy.mesh.position.addScaledVector(dir, enemy.currentSpeed);
          enemy.mesh.lookAt(target);
        }
      }

      // 防禦塔射擊
      towers.forEach(tower => {
        if (tower.cooldown > 0) tower.cooldown--;

        if (tower.cooldown <= 0) {
          let targetEnemy = null;
          let maxProgress = -1;

          enemies.forEach(enemy => {
            const dist = tower.mesh.position.distanceTo(enemy.mesh.position);
            if (dist <= tower.range) {
              const progress = enemy.targetIdx * 100 - enemy.mesh.position.distanceTo(waypoints[enemy.targetIdx]);
              if (progress > maxProgress) {
                maxProgress = progress;
                targetEnemy = enemy;
              }
            }
          });

          if (targetEnemy) {
            tower.mesh.lookAt(targetEnemy.mesh.position.x, tower.mesh.position.y, targetEnemy.mesh.position.z);

            const pGeo = new THREE.SphereGeometry(0.15, 6, 6);
            const pMat = new THREE.MeshBasicMaterial({ color: TOWER_TYPES[tower.type].color });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pMesh.position.copy(tower.mesh.position);
            pMesh.position.y += 1.2;
            scene.add(pMesh);

            projectiles.push({
              mesh: pMesh,
              target: targetEnemy,
              targetPos: targetEnemy.mesh.position.clone(),
              type: tower.type,
              damage: tower.damage,
              color: TOWER_TYPES[tower.type].color,
              speed: 0.4
            });
            tower.cooldown = tower.rate;
          }
        }
      });

      // 子彈更新
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (enemies.includes(p.target)) {
          p.targetPos.copy(p.target.mesh.position);
        }

        const dir = new THREE.Vector3().subVectors(p.targetPos, p.mesh.position);
        const dist = dir.length();

        if (dist < p.speed) {
          createExplosionEffect(p.targetPos, p.color);
          if (p.type === 'cannon') {
            enemies.forEach(e => {
              if (e.mesh.position.distanceTo(p.targetPos) <= TOWER_TYPES.cannon.splash) {
                e.hp -= p.damage;
              }
            });
          } else {
            if (enemies.includes(p.target)) {
              p.target.hp -= p.damage;
              if (p.type === 'frost') p.target.slowTimer = 90;
            }
          }
          scene.remove(p.mesh);
          projectiles.splice(i, 1);
        } else {
          dir.normalize();
          p.mesh.position.addScaledVector(dir, p.speed);
        }
      }

      // 擊殺結算
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].hp <= 0) {
          gold += enemies[i].reward;
          createExplosionEffect(enemies[i].mesh.position, 0xfacc15);
          scene.remove(enemies[i].mesh);
          enemies.splice(i, 1);
        }
      }

      if (waveInProgress && enemiesToSpawn === 0 && enemies.length === 0) {
        waveInProgress = false;
        startWaveBtn.disabled = false;
        gold += 25 + wave * 5;
      }

      updateUI();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateGame();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
